name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ott
          POSTGRES_PASSWORD: ott
          POSTGRES_DB: ott_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ott"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ott:ott@localhost:5432/ott_test
      TEST_DATABASE_URL: postgresql://ott:ott@localhost:5432/ott_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @ott/shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
