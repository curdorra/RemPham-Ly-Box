# Render Blueprint: the API. (The website goes on Vercel; the database on Supabase.)
services:
  - type: web
    name: rempham-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # Supabase "Session pooler" connection string
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: WEB_ORIGIN          # e.g. https://rempham.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Required in production by the API. Until Razorpay is set up, use any placeholder
      # (payments will not work yet); see docs/deploy.md.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Cloudflare R2: artwork uploads from the staff screens. Without these, uploads
      # are refused in production (paste an image URL instead).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: remphamly-media
      - key: MEDIA_BASE_URL      # the bucket's public URL (r2.dev now; custom domain before launch)
        sync: false
      # Signs film links. Must match the media Worker's SIGNING_KEY secret (apps/media-worker).
      - key: CDN_SIGNING_KEY
        sync: false
      # Encrypts films; same value wherever films are packaged (lib/film-keys.ts).
      - key: CONTENT_KEY_SECRET
        sync: false
