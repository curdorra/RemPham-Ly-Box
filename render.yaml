# Render Blueprint: the API and the film worker. (The website goes on Vercel; the database on Supabase.)
services:
  - type: web
    name: rempham-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # Supabase "Session pooler" connection string
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: WEB_ORIGIN          # e.g. https://rempham.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Required in production by the API. Until Razorpay is set up, use any placeholder
      # (payments will not work yet); see docs/deploy.md.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Cloudflare R2: artwork uploads from the staff screens. Without these, uploads
      # are refused in production (paste an image URL instead).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: remphamly-media
      - key: MEDIA_BASE_URL      # the bucket's public URL (r2.dev now; custom domain before launch)
        sync: false
      # Signs film links. Must match the media Worker's SIGNING_KEY secret (apps/media-worker).
      - key: CDN_SIGNING_KEY
        sync: false
      # Encrypts films; same value on API and worker (lib/film-keys.ts).
      - key: CONTENT_KEY_SECRET
        sync: false

  # Converts films uploaded from the staff screens into HLS on R2. Needs the API's database and
  # R2 settings (copied from it below). The config check also wants JWT_SECRET and the Razorpay
  # vars, which the worker never uses. Starter (512 MB) converts a feature film in roughly
  # 1–3 hours; if conversions fail with "ran out of memory", move it to Standard.
  - type: worker
    name: rempham-film-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./apps/api/worker.Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_POOL_MAX
        value: "2"
      - key: DATABASE_URL
        fromService:
          type: web
          name: rempham-api
          envVarKey: DATABASE_URL
      - key: JWT_SECRET
        fromService:
          type: web
          name: rempham-api
          envVarKey: JWT_SECRET
      - key: RAZORPAY_KEY_ID
        fromService:
          type: web
          name: rempham-api
          envVarKey: RAZORPAY_KEY_ID
      - key: RAZORPAY_KEY_SECRET
        fromService:
          type: web
          name: rempham-api
          envVarKey: RAZORPAY_KEY_SECRET
      - key: RAZORPAY_WEBHOOK_SECRET
        fromService:
          type: web
          name: rempham-api
          envVarKey: RAZORPAY_WEBHOOK_SECRET
      - key: R2_ACCOUNT_ID
        fromService:
          type: web
          name: rempham-api
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: rempham-api
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: rempham-api
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET
        fromService:
          type: web
          name: rempham-api
          envVarKey: R2_BUCKET
      - key: MEDIA_BASE_URL
        fromService:
          type: web
          name: rempham-api
          envVarKey: MEDIA_BASE_URL
      # Encrypts films; same value on API and worker (lib/film-keys.ts).
      - key: CONTENT_KEY_SECRET
        fromService:
          type: web
          name: rempham-api
          envVarKey: CONTENT_KEY_SECRET
